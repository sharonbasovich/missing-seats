<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#6d28d9"/>
  <!-- two filled seats -->
  <rect x="14" y="18" width="12" height="20" rx="4" fill="#ffffff"/>
  <rect x="14" y="42" width="12" height="8" rx="3" fill="#ffffff"/>
  <rect x="40" y="18" width="12" height="20" rx="4" fill="#ffffff"/>
  <rect x="40" y="42" width="12" height="8" rx="3" fill="#ffffff"/>
  <!-- the missing seat, outlined in gold -->
  <rect x="27" y="18" width="12" height="20" rx="4" fill="none" stroke="#d97706" stroke-width="3"/>
  <rect x="27" y="42" width="12" height="8" rx="3" fill="none" stroke="#d97706" stroke-width="3"/>
</svg>
